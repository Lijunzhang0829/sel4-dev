# sel4-l4v container — entry point for skill scripts and ad-hoc Isabelle work.
#
# Image: sel4-public:tuned
#   29 pre-built session heaps under /root/.isabelle/heaps/polyml-5.9.1_x86_64_32-linux/
#   ML_OPTIONS="-H 8000 --maxheap 16000 --stackspace 64"
#   See baseline-restore.md for the difference vs sel4-public:baseline-clean.
#
# Mounts:
#   ./:/workspace
#       Project root mounted at /workspace. The skill scripts under
#       .claude/skills/isabelle_prover/scripts-container/ resolve REPO_ROOT to
#       /workspace and translate host paths accordingly. The l4v sources
#       (verification/l4v/) are visible at /workspace/verification/l4v inside
#       the container — same as outside, so edits sync naturally.
#       Reports written by scan-slow-proofs.sh land in
#       /workspace/verification/l4v/reports/ (the script uses $PWD/reports/),
#       which appears on host as verification/l4v/reports/. (verification/ is
#       gitignored.)
#
# Heaps stay inside the container at /root/.isabelle/heaps (image-baked, not
# bind-mounted). To extract a heap to host, use `docker cp sel4-l4v:...`
# Sessions can be rebuilt via `docker compose exec l4v isabelle build ...`.

services:
  l4v:
    image: sel4-public:tuned
    container_name: sel4-l4v
    network_mode: host
    working_dir: /workspace/verification/l4v
    volumes:
      - ./:/workspace
    environment:
      L4V_ARCH: ARM
      # Skill scripts and run.sh invoke `isabelle ...` bare; the image's
      # Dockerfile doesn't add isabelle/bin to PATH (uses relative
      # ./isabelle/bin/isabelle in its WORKDIR). Prepending the mounted
      # Isabelle bin makes the bare invocation work in this compose context.
      PATH: /workspace/verification/isabelle/bin:/root/.local/bin:/opt/conda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Match the threads=8 setting that Exp A confirmed (CBaseRefine -17%
      # wall vs the original threads=4). The image already has -H 8000 in
      # /root/.isabelle/etc/settings; this controls within-session worker
      # threads for `isabelle build`.
      ISABELLE_BUILD_OPTIONS: "threads=8"
    stdin_open: true
    tty: true
    command: bash
